<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Enemind — Engineering Skills for Chuka University Students</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Space+Grotesk:wght@500;700&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --chuka-red:#8B0000;--chuka-red2:#A52020;--chuka-red3:#6a0000;
  --chuka-gold:#C8960C;--chuka-gold2:#E8B420;--chuka-gold3:#f5d060;
  --chuka-cream:#fff9ee;--teal-light:#e1f5ee;--teal-text:#0f6e56;
  --blue-light:#e6f1fb;--blue-text:#185fa5;--amber-light:#faeeda;--amber-text:#854f0b;
  --purple-light:#eeedfe;--purple-text:#534ab7;--coral-light:#faece7;--coral-text:#993c1d;
  --text:#111827;--text-muted:#6b7280;--text-light:#9ca3af;
  --border:#e5e7eb;--bg:#ffffff;--bg-soft:#fdf8f0;
  --radius:10px;--radius-lg:16px;
  --shadow:0 1px 3px rgba(0,0,0,.08),0 1px 2px rgba(0,0,0,.04);
  --shadow-md:0 4px 16px rgba(0,0,0,.10);
}
html{scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;color:var(--text);background:var(--bg);line-height:1.6;font-size:16px}
h1,h2,h3,h4{font-family:'Space Grotesk',sans-serif;line-height:1.2;color:var(--text)}
.nav{position:sticky;top:0;z-index:200;background:rgba(255,255,255,.97);backdrop-filter:blur(12px);border-bottom:3px solid var(--chuka-red);display:flex;align-items:center;justify-content:space-between;padding:8px 40px}
.nav-logo{display:flex;align-items:center;gap:12px;text-decoration:none;cursor:pointer}
.logo-img{height:52px;width:auto;object-fit:contain;display:block}
.logo-name-wrap{display:flex;flex-direction:column;line-height:1.15}
.logo-name{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:var(--chuka-red);letter-spacing:-.3px}
.logo-sub{font-size:10px;font-weight:500;color:var(--chuka-gold);text-transform:uppercase;letter-spacing:.1em}
.nav-links{display:flex;gap:4px;list-style:none;align-items:center}
.nav-links>li{position:relative}
.nav-links a,.nav-links .nav-dd-trigger{font-size:13px;font-weight:500;color:var(--text-muted);text-decoration:none;padding:6px 13px;border-radius:8px;transition:all .15s;cursor:pointer;display:flex;align-items:center;gap:4px;background:none;border:none;font-family:'Inter',sans-serif}
.nav-links a:hover,.nav-links a.active,.nav-links .nav-dd-trigger:hover,.nav-links .nav-dd-trigger.active{background:rgba(139,0,0,.08);color:var(--chuka-red)}
.dd-arrow{font-size:10px;transition:transform .2s;display:inline-block}
.nav-dd:hover .dd-arrow,.nav-dd.open .dd-arrow{transform:rotate(180deg)}
.dd-menu{position:absolute;top:calc(100% + 8px);left:0;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);box-shadow:var(--shadow-md);min-width:280px;padding:8px;z-index:300;opacity:0;visibility:hidden;transform:translateY(-6px);transition:all .18s ease}
.nav-dd:hover .dd-menu,.nav-dd.open .dd-menu{opacity:1;visibility:visible;transform:translateY(0)}
.dd-item{display:flex;align-items:flex-start;gap:10px;padding:10px 12px;border-radius:8px;cursor:pointer;transition:background .12s;text-decoration:none}
.dd-item:hover{background:var(--bg-soft)}
.dd-icon{width:32px;height:32px;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:15px;flex-shrink:0}
.dd-label{font-size:13px;font-weight:600;color:var(--text);display:block;margin-bottom:2px}
.dd-desc{font-size:11px;color:var(--text-muted);display:block;line-height:1.4}
.dd-divider{height:1px;background:var(--border);margin:6px 0}
.dd-all{font-size:13px;font-weight:600;color:var(--chuka-red);padding:8px 12px;display:block;border-radius:8px;text-decoration:none}
.dd-all:hover{background:rgba(139,0,0,.07)}
.nav-hamburger{display:none;background:none;border:none;cursor:pointer;padding:4px}
.nav-mobile{display:none}
.page{display:none}.page.active{display:block}
/* HERO */
.hero{position:relative;padding:96px 40px 80px;text-align:center;overflow:hidden;border-bottom:1px solid var(--border);min-height:500px;display:flex;align-items:center;justify-content:center}
.hero-bg{position:absolute;inset:0;z-index:0;background:url('https://portal.chuka.ac.ke/assets/images/logo2.png') center/contain no-repeat,linear-gradient(160deg,var(--chuka-red3) 0%,var(--chuka-red) 50%,#5a0000 100%);background-blend-mode:luminosity;filter:brightness(.18) saturate(1.1);transform:scale(1.04)}
.hero-overlay{position:absolute;inset:0;z-index:1;background:linear-gradient(160deg,rgba(139,0,0,.9) 0%,rgba(200,150,12,.5) 100%)}
.hero-content{position:relative;z-index:2;max-width:700px;margin:0 auto}
.hero-chuka-logo{width:90px;height:90px;object-fit:contain;margin:0 auto 20px;display:block;filter:drop-shadow(0 2px 12px rgba(0,0,0,.4));border-radius:50%;background:rgba(255,255,255,.1);padding:6px}
.hero-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(200,150,12,.25);color:var(--chuka-gold3);font-size:11px;font-weight:700;padding:5px 16px;border-radius:99px;margin-bottom:18px;letter-spacing:.06em;border:1px solid rgba(200,150,12,.4);backdrop-filter:blur(4px);text-transform:uppercase}
.hero h1{font-size:clamp(30px,5vw,56px);font-weight:700;max-width:660px;margin:0 auto 18px;color:#fff;letter-spacing:-1.5px;text-shadow:0 2px 20px rgba(0,0,0,.4)}
.hero h1 span{color:var(--chuka-gold3)}
.hero p{font-size:17px;color:rgba(255,255,255,.82);max-width:520px;margin:0 auto 32px;line-height:1.7}
.hero-btns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
.btn{display:inline-block;padding:12px 28px;border-radius:9px;font-size:15px;font-weight:600;text-decoration:none;cursor:pointer;border:none;transition:all .15s;font-family:'Inter',sans-serif}
.btn-red{background:var(--chuka-red);color:#fff}.btn-red:hover{background:var(--chuka-red2);transform:translateY(-1px);box-shadow:var(--shadow-md)}
.btn-gold{background:linear-gradient(135deg,var(--chuka-gold),var(--chuka-gold2));color:var(--chuka-red3);font-weight:700}.btn-gold:hover{transform:translateY(-1px);box-shadow:0 6px 20px rgba(200,150,12,.4)}
.btn-ghost-white{background:rgba(255,255,255,.12);color:#fff;border:1px solid rgba(255,255,255,.3);backdrop-filter:blur(4px)}.btn-ghost-white:hover{background:rgba(255,255,255,.22)}
/* STATS */
.stats{display:flex;justify-content:center;gap:0;border-bottom:1px solid var(--border);background:var(--bg)}
.stat{text-align:center;padding:26px 40px;border-right:1px solid var(--border)}.stat:last-child{border-right:none}
.stat-num{font-family:'Space Grotesk',sans-serif;font-size:30px;font-weight:700;color:var(--chuka-red)}
.stat-label{font-size:13px;color:var(--text-muted);margin-top:2px}
/* YEAR BAND */
.year-band{background:linear-gradient(135deg,var(--chuka-red3),var(--chuka-red));padding:36px 40px;display:flex;align-items:center;justify-content:space-between;gap:16px;flex-wrap:wrap}
.year-band-title{color:#fff;font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700}
.year-band-sub{color:rgba(255,255,255,.65);font-size:13px;margin-top:3px}
.year-pills{display:flex;gap:8px;flex-wrap:wrap}
.year-pill{padding:9px 20px;border-radius:99px;font-size:13px;font-weight:600;border:2px solid rgba(255,255,255,.3);background:rgba(255,255,255,.08);color:rgba(255,255,255,.85);cursor:pointer;transition:all .18s;font-family:'Inter',sans-serif}
.year-pill:hover,.year-pill.active{background:var(--chuka-gold);border-color:var(--chuka-gold);color:var(--chuka-red3);transform:translateY(-1px)}
/* SECTION */
.section{padding:64px 40px}.section.alt{background:var(--bg-soft)}
.section-header{max-width:560px;margin-bottom:48px}.section-header.centered{text-align:center;margin:0 auto 48px}
.eyebrow{font-size:11px;font-weight:700;color:var(--chuka-gold);text-transform:uppercase;letter-spacing:.1em;margin-bottom:8px}
.section-title{font-size:32px;font-weight:700;margin-bottom:12px;letter-spacing:-.5px}
.section-sub{font-size:15px;color:var(--text-muted);line-height:1.7}
/* CARDS */
.cards-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px}
.card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:26px 22px;cursor:pointer;transition:all .2s;box-shadow:var(--shadow)}
.card:hover{border-color:var(--chuka-red);box-shadow:var(--shadow-md);transform:translateY(-2px)}
.card-icon{width:48px;height:48px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;font-size:22px}
.ic-red{background:rgba(139,0,0,.1);color:var(--chuka-red)}.ic-gold{background:rgba(200,150,12,.1);color:#7a5800}
.ic-teal{background:var(--teal-light);color:var(--teal-text)}.ic-blue{background:var(--blue-light);color:var(--blue-text)}
.ic-purple{background:var(--purple-light);color:var(--purple-text)}.ic-coral{background:var(--coral-light);color:var(--coral-text)}
.ic-green{background:#e8f5e9;color:#2e7d32}
.card h3{font-size:15px;font-weight:600;margin-bottom:8px}.card p{font-size:13px;color:var(--text-muted);line-height:1.65}
.card-tag{display:inline-block;margin-top:14px;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;letter-spacing:.04em}
.tag-red{background:rgba(139,0,0,.1);color:var(--chuka-red)}.tag-gold{background:rgba(200,150,12,.15);color:#7a5800}
.tag-teal{background:var(--teal-light);color:var(--teal-text)}.tag-blue{background:var(--blue-light);color:var(--blue-text)}
.tag-amber{background:var(--amber-light);color:var(--amber-text)}.tag-purple{background:var(--purple-light);color:var(--purple-text)}
.tag-coral{background:var(--coral-light);color:var(--coral-text)}.tag-green{background:#e8f5e9;color:#2e7d32}
/* AUTO */
.auto-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:24px}
.auto-card{border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);transition:all .2s;cursor:pointer;background:var(--bg)}
.auto-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--chuka-red)}
.auto-img{width:100%;height:175px;object-fit:cover;display:block}
.auto-body{padding:20px}.auto-body h3{font-size:15px;font-weight:600;margin-bottom:8px}.auto-body p{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:12px}
.auto-tags{display:flex;gap:6px;flex-wrap:wrap}.auto-tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
/* WHY */
.why-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:16px}
.why-item{display:flex;align-items:flex-start;gap:14px;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)}
.why-icon{font-size:22px;flex-shrink:0;margin-top:2px}
.why-item h4{font-size:14px;font-weight:600;margin-bottom:5px}.why-item p{font-size:13px;color:var(--text-muted);line-height:1.55}
/* TESTIMONIALS */
.testimonials{display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:20px}
.tcard{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px;box-shadow:var(--shadow)}
.stars{color:var(--chuka-gold);font-size:14px;letter-spacing:2px;margin-bottom:12px}
.tcard p{font-size:14px;color:var(--text-muted);line-height:1.7;font-style:italic;margin-bottom:18px}
.tcard-author{display:flex;align-items:center;gap:12px}
.avatar{width:40px;height:40px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:700}
.av-red{background:rgba(139,0,0,.12);color:var(--chuka-red)}.av-gold{background:rgba(200,150,12,.15);color:#7a5800}.av-teal{background:var(--teal-light);color:var(--teal-text)}
.tname{font-size:14px;font-weight:600}.trole{font-size:12px;color:var(--text-muted)}
/* CTA BAND */
.cta-band{background:linear-gradient(135deg,var(--chuka-red3) 0%,var(--chuka-red) 100%);padding:64px 40px;text-align:center}
.cta-band h2{font-size:34px;font-weight:700;color:#fff;margin-bottom:12px}
.cta-band p{font-size:17px;color:rgba(255,255,255,.72);margin-bottom:32px}
/* CHUKA DIVIDER */
.chuka-divider{text-align:center;padding:20px 40px;background:var(--chuka-cream);border-top:1px solid rgba(200,150,12,.2);border-bottom:1px solid rgba(200,150,12,.2);display:flex;align-items:center;justify-content:center;gap:16px}
.chuka-divider img{height:36px;width:auto;object-fit:contain}
.chuka-divider-text{font-size:13px;color:var(--chuka-red);font-weight:600;letter-spacing:.04em}
/* COURSES */
.courses-top{background:linear-gradient(135deg,var(--chuka-red3),var(--chuka-red));padding:48px 40px 0;color:#fff}
.courses-top h1{color:#fff;font-size:32px;margin-bottom:8px}
.courses-top p{color:rgba(255,255,255,.72);font-size:15px;max-width:540px;margin-bottom:28px}
.year-tabs{display:flex;gap:0;overflow-x:auto}
.year-tab{padding:14px 28px;font-size:14px;font-weight:600;color:rgba(255,255,255,.55);cursor:pointer;border:none;background:transparent;font-family:'Inter',sans-serif;border-bottom:3px solid transparent;white-space:nowrap;transition:all .18s}
.year-tab:hover{color:rgba(255,255,255,.85)}.year-tab.active{color:#fff;border-bottom-color:var(--chuka-gold)}
.year-panel{display:none}.year-panel.active{display:block}
.year-hero{padding:32px 40px;display:flex;gap:20px;align-items:center;flex-wrap:wrap;background:rgba(139,0,0,.04);border-bottom:1px solid var(--border)}
.year-badge{display:inline-flex;align-items:center;gap:8px;background:linear-gradient(135deg,var(--chuka-red),var(--chuka-red2));color:#fff;border-radius:99px;padding:8px 20px;font-size:13px;font-weight:700;flex-shrink:0}
.year-desc{flex:1;min-width:220px}.year-desc h2{font-size:20px;margin-bottom:4px}.year-desc p{font-size:13px;color:var(--text-muted)}
.courses-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:24px;padding:32px 40px}
.course-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);transition:all .2s}
.course-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--chuka-red)}
.course-thumb{height:175px;overflow:hidden;position:relative}
.course-thumb img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.course-card:hover .course-thumb img{transform:scale(1.04)}
.thumb-badge{position:absolute;top:12px;left:12px;background:rgba(139,0,0,.88);color:#fff;font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px;backdrop-filter:blur(4px)}
.course-body{padding:20px}.course-body h3{font-size:15px;font-weight:600;margin-bottom:8px}.course-body p{font-size:13px;color:var(--text-muted);line-height:1.6;margin-bottom:16px}
.course-meta{display:flex;align-items:center;justify-content:space-between}
.course-level{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.level-beg{background:var(--teal-light);color:var(--teal-text)}.level-int{background:var(--amber-light);color:var(--amber-text)}.level-adv{background:var(--coral-light);color:var(--coral-text)}
.course-price{font-size:15px;font-weight:700;color:var(--chuka-red)}
.enroll-btn{display:block;width:100%;margin-top:14px;background:var(--chuka-red);color:#fff;border:none;padding:10px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s}
.enroll-btn:hover{background:var(--chuka-red2)}
/* SHOP */
.shop-tabs{display:flex;gap:4px;background:var(--bg-soft);border-radius:10px;padding:4px;width:fit-content;margin-bottom:36px;border:1px solid var(--border)}
.shop-tab{padding:8px 22px;border-radius:8px;font-size:14px;font-weight:500;cursor:pointer;border:none;background:none;color:var(--text-muted);font-family:'Inter',sans-serif;transition:all .15s}
.shop-tab.active{background:var(--bg);color:var(--chuka-red);box-shadow:var(--shadow);font-weight:600}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:20px}
.product-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);transition:all .2s}
.product-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-md);border-color:var(--chuka-red)}
.product-img-wrap{height:150px;overflow:hidden}
.product-img-wrap img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.product-card:hover .product-img-wrap img{transform:scale(1.05)}
.product-body{padding:16px}.product-body h4{font-size:14px;font-weight:600;margin-bottom:6px}.product-body p{font-size:12px;color:var(--text-muted);line-height:1.55;margin-bottom:12px}
.product-footer{display:flex;align-items:center;justify-content:space-between}
.product-price{font-size:15px;font-weight:700;color:var(--chuka-red)}
.add-btn{background:var(--chuka-red);color:#fff;border:none;padding:6px 14px;border-radius:7px;font-size:12px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s}
.add-btn:hover{background:var(--chuka-red2)}.in-stock{font-size:11px;color:var(--teal-text);font-weight:500}
/* PORTFOLIO */
.portfolio-hero{background:linear-gradient(135deg,var(--chuka-red3) 0%,var(--chuka-red) 100%);padding:60px 40px;color:#fff}
.portfolio-hero h1{color:#fff;font-size:34px;margin-bottom:12px}
.portfolio-hero p{color:rgba(255,255,255,.75);font-size:16px;max-width:540px}
.portfolio-steps{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:20px;margin-bottom:48px}
.step-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:24px 20px;box-shadow:var(--shadow)}
.step-num{width:36px;height:36px;border-radius:50%;background:var(--chuka-red);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Space Grotesk',sans-serif;font-size:16px;font-weight:700;margin-bottom:14px}
.step-card h3{font-size:15px;font-weight:600;margin-bottom:8px}.step-card p{font-size:13px;color:var(--text-muted);line-height:1.6}
.portfolio-showcase{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.portfolio-item{background:var(--bg-soft);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);transition:all .2s;cursor:pointer}
.portfolio-item:hover{box-shadow:var(--shadow-md);transform:translateY(-2px);border-color:var(--chuka-red)}
.portfolio-thumb{height:160px;overflow:hidden}
.portfolio-thumb img{width:100%;height:100%;object-fit:cover;display:block}
.portfolio-info{padding:18px}.portfolio-info h4{font-size:15px;font-weight:600;margin-bottom:6px}.portfolio-info p{font-size:13px;color:var(--text-muted);line-height:1.55}
.portfolio-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px}
.ptag{font-size:11px;font-weight:600;padding:3px 9px;border-radius:99px;background:var(--blue-light);color:var(--blue-text)}
.live-portfolio-wrap{border:2px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-md);margin-bottom:48px;background:var(--bg)}
.live-portfolio-header{background:linear-gradient(135deg,var(--chuka-red3),var(--chuka-red));padding:14px 22px;display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap}
.live-portfolio-header-left{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.live-badge{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.15);color:#fff;font-size:11px;font-weight:700;padding:4px 12px;border-radius:99px;border:1px solid rgba(255,255,255,.3)}
.live-badge-dot{width:7px;height:7px;border-radius:50%;background:#4ade80;display:inline-block;animation:pulse 1.5s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:.4}}
.live-portfolio-header h4{font-size:14px;font-weight:700;color:#fff;margin:0}
.live-portfolio-header p{font-size:11px;color:rgba(255,255,255,.65);margin:0}
.live-portfolio-open{font-size:12px;font-weight:600;color:#fff;text-decoration:none;background:rgba(255,255,255,.15);padding:6px 14px;border-radius:8px;border:1px solid rgba(255,255,255,.3);transition:background .15s;white-space:nowrap}
.live-portfolio-open:hover{background:rgba(255,255,255,.28)}
.portfolio-preview-card{display:block;text-decoration:none;padding:48px 32px;text-align:center;background:linear-gradient(145deg,#faf8f5,#f0ede7);transition:all .2s;cursor:pointer;border-top:1px solid var(--border)}
.portfolio-preview-card:hover{background:linear-gradient(145deg,#f5f2ec,#e8e3db)}
.preview-icon{font-size:48px;margin-bottom:16px}.preview-title{font-size:18px;font-weight:700;color:var(--chuka-red);margin-bottom:8px}
.preview-desc{font-size:13px;color:var(--text-muted);margin-bottom:20px}
.preview-btn{display:inline-block;background:var(--chuka-red);color:#fff;padding:10px 24px;border-radius:40px;font-size:13px;font-weight:600;text-decoration:none;transition:all .15s}
.preview-btn:hover{background:var(--chuka-red2);transform:translateY(-1px)}
/* CLUB */
.club-hero{background:linear-gradient(135deg,#1a0000 0%,var(--chuka-red3) 50%,var(--chuka-red) 100%);padding:72px 40px 56px;color:#fff;position:relative;overflow:hidden}
.club-hero::before{content:'⚙️';position:absolute;right:-20px;top:-20px;font-size:200px;opacity:.06;line-height:1}
.club-logo-header{display:flex;align-items:center;gap:24px;margin-bottom:28px;flex-wrap:wrap}
.club-logo-img{width:110px;height:110px;object-fit:contain;border-radius:18px;background:rgba(255,255,255,.12);padding:10px;border:2px solid rgba(255,255,255,.3);box-shadow:0 4px 24px rgba(0,0,0,.35);flex-shrink:0}
.club-logo-text h1{color:#fff;font-size:clamp(26px,4vw,40px);margin-bottom:6px}
.club-logo-text p{color:rgba(255,255,255,.7);font-size:15px;max-width:480px}
.club-hero-btns{display:flex;gap:12px;flex-wrap:wrap}
.club-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));background:var(--bg);border-bottom:1px solid var(--border)}
.club-stat{text-align:center;padding:24px 20px;border-right:1px solid var(--border)}.club-stat:last-child{border-right:none}
.club-stat-num{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:var(--chuka-red)}
.club-stat-label{font-size:12px;color:var(--text-muted);margin-top:3px}
.club-activities{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:20px}
.club-activity-card{border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--border);background:var(--bg);transition:all .2s}
.club-activity-card:hover{transform:translateY(-3px);box-shadow:var(--shadow-md);border-color:var(--chuka-red)}
.club-activity-img{height:160px;overflow:hidden}
.club-activity-img img{width:100%;height:100%;object-fit:cover;display:block;transition:transform .3s}
.club-activity-card:hover .club-activity-img img{transform:scale(1.04)}
.club-activity-body{padding:20px}.club-activity-body h3{font-size:15px;font-weight:600;margin-bottom:8px}.club-activity-body p{font-size:13px;color:var(--text-muted);line-height:1.6}
.club-activity-meta{display:flex;align-items:center;gap:8px;margin-top:14px}
.club-activity-tag{font-size:11px;font-weight:600;padding:3px 10px;border-radius:99px}
.club-events{display:flex;flex-direction:column;gap:14px}
.club-event{display:flex;gap:16px;align-items:flex-start;background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;box-shadow:var(--shadow);transition:all .2s;cursor:pointer}
.club-event:hover{border-color:var(--chuka-red);box-shadow:var(--shadow-md)}
.club-event-date{flex-shrink:0;width:52px;text-align:center;background:linear-gradient(135deg,var(--chuka-red3),var(--chuka-red));border-radius:10px;padding:8px 4px;color:#fff}
.club-event-day{font-size:22px;font-weight:700;font-family:'Space Grotesk',sans-serif;line-height:1}
.club-event-month{font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;opacity:.8}
.club-event-info h4{font-size:15px;font-weight:600;margin-bottom:4px}
.club-event-info p{font-size:13px;color:var(--text-muted);line-height:1.5}
.club-event-tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}
.club-event-tag{font-size:11px;font-weight:600;padding:2px 9px;border-radius:99px;background:var(--blue-light);color:var(--blue-text)}
/* ANNOUNCEMENTS */
.announcements-section{padding:0 40px 48px}
.announcement-card{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);padding:22px 24px;margin-bottom:16px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.announcement-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--chuka-red);border-radius:4px 0 0 4px}
.announcement-card.pinned::before{background:var(--chuka-gold)}
.announcement-meta{display:flex;align-items:center;gap:10px;margin-bottom:8px;flex-wrap:wrap}
.announcement-author{font-size:12px;font-weight:700;color:var(--chuka-red)}
.announcement-date{font-size:11px;color:var(--text-light)}
.announcement-pin{font-size:11px;font-weight:700;background:rgba(200,150,12,.15);color:#7a5800;padding:2px 8px;border-radius:99px}
.announcement-card h4{font-size:15px;font-weight:600;margin-bottom:6px}
.announcement-card p{font-size:14px;color:var(--text-muted);line-height:1.65}
.announcement-img{width:100%;border-radius:10px;margin-top:14px;max-height:280px;object-fit:cover;display:block}
.announcement-empty{text-align:center;padding:48px 24px;color:var(--text-light);font-size:14px}
/* CONTACT */
.contact-page-wrap{max-width:960px;margin:0 auto;padding:56px 40px}
.contact-top{display:grid;grid-template-columns:1fr 2fr;gap:48px;align-items:start}
.contact-sidebar h2{font-size:28px;font-weight:700;margin-bottom:12px}
.contact-sidebar>p{font-size:15px;color:var(--text-muted);margin-bottom:32px;line-height:1.7}
.contact-item{display:flex;align-items:flex-start;gap:14px;margin-bottom:22px}
.contact-icon{width:44px;height:44px;border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:20px;flex-shrink:0}
.ci-phone{background:var(--teal-light)}.ci-email{background:var(--blue-light)}.ci-ig{background:var(--purple-light)}
.contact-item h4{font-size:11px;font-weight:600;color:var(--text-muted);margin-bottom:3px;text-transform:uppercase;letter-spacing:.06em}
.contact-item a,.contact-item p{font-size:15px;color:var(--text);text-decoration:none;font-weight:500}
.contact-item a:hover{color:var(--chuka-red);text-decoration:underline}
.contact-local{margin-top:24px;padding:16px 18px;background:rgba(139,0,0,.05);border:1px solid rgba(139,0,0,.15);border-radius:12px}
.contact-local-label{font-size:12px;font-weight:700;color:var(--chuka-red);text-transform:uppercase;letter-spacing:.06em;margin-bottom:8px}
.contact-local p{font-size:13px;color:var(--text-muted);line-height:1.6}
.gform-wrap{background:var(--bg);border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow-md)}
.gform-header{background:linear-gradient(135deg,var(--chuka-red3),var(--chuka-red));padding:20px 28px;display:flex;align-items:center;gap:12px}
.gform-header-icon{font-size:22px}
.gform-header h3{font-size:17px;font-weight:700;color:#fff;margin-bottom:2px}
.gform-header p{font-size:12px;color:rgba(255,255,255,.65)}
/* ADMIN */
#page-admin{background:var(--bg-soft);min-height:100vh}
.admin-topbar{background:linear-gradient(135deg,#0f0f1a,#1a0030);padding:16px 40px;display:flex;align-items:center;justify-content:space-between;border-bottom:3px solid var(--chuka-gold)}
.admin-topbar-left{display:flex;align-items:center;gap:14px}
.admin-logo{width:40px;height:40px;object-fit:contain}
.admin-title{font-family:'Space Grotesk',sans-serif;font-size:18px;font-weight:700;color:#fff}
.admin-subtitle{font-size:11px;color:rgba(255,255,255,.45)}
.admin-logout{background:rgba(255,255,255,.1);color:#fff;border:1px solid rgba(255,255,255,.2);padding:8px 18px;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;transition:all .15s}
.admin-logout:hover{background:rgba(255,255,255,.2)}
.admin-layout{display:grid;grid-template-columns:220px 1fr;min-height:calc(100vh - 73px)}
.admin-sidebar{background:#fff;border-right:1px solid var(--border);padding:24px 0}
.admin-nav-item{display:flex;align-items:center;gap:10px;padding:11px 24px;font-size:14px;font-weight:500;color:var(--text-muted);cursor:pointer;transition:all .15s;border-left:3px solid transparent}
.admin-nav-item:hover{background:var(--bg-soft);color:var(--text)}
.admin-nav-item.active{color:var(--chuka-red);background:rgba(139,0,0,.06);border-left-color:var(--chuka-red);font-weight:600}
.admin-nav-item .a-icon{font-size:18px;width:22px;text-align:center}
.admin-nav-section{font-size:10px;font-weight:700;color:var(--text-light);padding:18px 24px 6px;text-transform:uppercase;letter-spacing:.1em}
.admin-content{padding:36px 40px;overflow-y:auto}
.admin-panel{display:none}.admin-panel.active{display:block}
.admin-panel-title{font-size:22px;font-weight:700;margin-bottom:6px}
.admin-panel-sub{font-size:14px;color:var(--text-muted);margin-bottom:32px}
.admin-stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:16px;margin-bottom:36px}
.admin-stat-card{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:20px;box-shadow:var(--shadow)}
.admin-stat-card .num{font-family:'Space Grotesk',sans-serif;font-size:28px;font-weight:700;color:var(--chuka-red)}
.admin-stat-card .lbl{font-size:12px;color:var(--text-muted);margin-top:4px}
.admin-stat-card .chg{font-size:11px;font-weight:600;color:var(--teal-text);margin-top:6px}
.admin-form{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);padding:28px;box-shadow:var(--shadow);margin-bottom:28px}
.admin-form h3{font-size:16px;font-weight:700;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--border)}
.form-row{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-bottom:0}
.form-row.full{grid-template-columns:1fr}
.form-group{display:flex;flex-direction:column;gap:6px;margin-bottom:16px}
.form-group label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em}
.form-group input,.form-group textarea,.form-group select{padding:10px 14px;border:1px solid var(--border);border-radius:8px;font-size:14px;font-family:'Inter',sans-serif;color:var(--text);background:#fff;outline:none;transition:border-color .15s}
.form-group input:focus,.form-group textarea:focus,.form-group select:focus{border-color:var(--chuka-red);box-shadow:0 0 0 3px rgba(139,0,0,.08)}
.form-group textarea{resize:vertical;min-height:100px}
.form-actions{display:flex;gap:10px;align-items:center;padding-top:6px}
.admin-btn{padding:10px 22px;border-radius:8px;font-size:14px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif;transition:all .15s}
.admin-btn-primary{background:var(--chuka-red);color:#fff}.admin-btn-primary:hover{background:var(--chuka-red2)}
.admin-btn-gold{background:linear-gradient(135deg,var(--chuka-gold),var(--chuka-gold2));color:var(--chuka-red3)}.admin-btn-gold:hover{opacity:.9}
.admin-btn-ghost{background:transparent;color:var(--text-muted);border:1px solid var(--border)}.admin-btn-ghost:hover{background:var(--bg-soft);color:var(--text)}
.admin-btn-danger{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}.admin-btn-danger:hover{background:#fecaca}
.admin-table-wrap{background:#fff;border:1px solid var(--border);border-radius:var(--radius-lg);overflow:hidden;box-shadow:var(--shadow)}
.admin-table-header{padding:18px 24px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--border)}
.admin-table-header h3{font-size:15px;font-weight:700}
table.admin-table{width:100%;border-collapse:collapse}
table.admin-table th{background:var(--bg-soft);font-size:11px;font-weight:700;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;padding:11px 18px;text-align:left;border-bottom:1px solid var(--border)}
table.admin-table td{padding:13px 18px;border-bottom:1px solid var(--border);font-size:14px;vertical-align:middle}
table.admin-table tr:last-child td{border-bottom:none}
table.admin-table tr:hover td{background:var(--bg-soft)}
.tbl-badge{display:inline-block;padding:3px 9px;border-radius:99px;font-size:11px;font-weight:600}
.tbl-badge-green{background:var(--teal-light);color:var(--teal-text)}.tbl-badge-amber{background:var(--amber-light);color:var(--amber-text)}.tbl-badge-red{background:rgba(139,0,0,.1);color:var(--chuka-red)}
.tbl-actions{display:flex;gap:6px}
.tbl-btn{padding:5px 12px;border-radius:6px;font-size:12px;font-weight:600;cursor:pointer;border:none;font-family:'Inter',sans-serif}
.tbl-btn-edit{background:var(--blue-light);color:var(--blue-text)}.tbl-btn-delete{background:#fee2e2;color:#b91c1c}
.admin-alert{padding:12px 16px;border-radius:8px;font-size:13px;font-weight:500;margin-bottom:18px;display:none}
.admin-alert.show{display:flex;align-items:center;gap:8px}
.admin-alert-success{background:#dcfce7;color:#15803d;border:1px solid #bbf7d0}
.admin-alert-error{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca}
.img-preview{width:100%;max-height:200px;object-fit:cover;border-radius:8px;margin-top:12px;display:none}
.img-preview.show{display:block}
/* LOGIN */
.admin-login-screen{min-height:100vh;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#0f0f1a,#1a0030,#2a0010);padding:20px}
.admin-login-box{background:#fff;border-radius:20px;padding:48px 40px;width:100%;max-width:380px;box-shadow:0 20px 60px rgba(0,0,0,.4)}
.admin-login-logo{text-align:center;margin-bottom:28px}
.admin-login-logo img{width:64px;height:64px;object-fit:contain;border-radius:12px;margin-bottom:10px}
.admin-login-logo h2{font-size:22px;font-weight:700;color:var(--chuka-red)}
.admin-login-logo p{font-size:13px;color:var(--text-muted);margin-top:4px}
.login-form .form-group{margin-bottom:18px}
.login-form .form-group label{font-size:12px;font-weight:600;color:var(--text-muted);text-transform:uppercase;letter-spacing:.06em;display:block;margin-bottom:6px}
.login-form input{width:100%;padding:12px 14px;border:1px solid var(--border);border-radius:9px;font-size:15px;font-family:'Inter',sans-serif;outline:none;transition:border-color .15s}
.login-form input:focus{border-color:var(--chuka-red);box-shadow:0 0 0 3px rgba(139,0,0,.08)}
.login-submit{width:100%;padding:13px;background:var(--chuka-red);color:#fff;border:none;border-radius:9px;font-size:15px;font-weight:700;cursor:pointer;font-family:'Inter',sans-serif;transition:background .15s;margin-top:4px}
.login-submit:hover{background:var(--chuka-red2)}
.login-error{background:#fee2e2;color:#b91c1c;border:1px solid #fecaca;border-radius:8px;padding:10px 14px;font-size:13px;font-weight:500;margin-bottom:16px;display:none}
.login-error.show{display:block}
.back-to-site-link{display:block;text-align:center;margin-top:20px;font-size:13px;color:var(--text-muted);text-decoration:none;cursor:pointer}
.back-to-site-link:hover{color:var(--chuka-red)}
/* FOOTER */
.footer{background:#1a0000;color:rgba(255,255,255,.65);padding:48px 40px 28px;border-top:3px solid var(--chuka-gold)}
.footer-grid{display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:40px;margin-bottom:40px}
.footer-brand p{font-size:13px;color:rgba(255,255,255,.45);margin-top:12px;line-height:1.7;max-width:240px}
.footer-logo-wrap{display:flex;align-items:center;gap:10px;margin-bottom:12px}
.footer-logo-img{height:44px;width:auto;object-fit:contain}
.footer-col h4{font-size:11px;font-weight:700;color:var(--chuka-gold2);margin-bottom:16px;text-transform:uppercase;letter-spacing:.1em}
.footer-col a{display:block;font-size:13px;color:rgba(255,255,255,.55);text-decoration:none;margin-bottom:10px;cursor:pointer;transition:color .15s}
.footer-col a:hover{color:var(--chuka-gold2)}
.footer-bottom{border-top:1px solid rgba(255,255,255,.08);padding-top:24px;display:flex;align-items:center;justify-content:space-between;font-size:12px;flex-wrap:wrap;gap:12px}
.social-links{display:flex;gap:10px}
.social-link{width:36px;height:36px;border-radius:8px;background:rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;color:rgba(255,255,255,.6);text-decoration:none;font-size:16px;transition:background .15s}
.social-link:hover{background:var(--chuka-red);color:#fff}
.chuka-credit{display:flex;align-items:center;gap:8px;font-size:12px;color:rgba(255,255,255,.35)}
.chuka-credit img{height:24px;width:auto;opacity:.5}
@media(max-width:768px){
  .nav{padding:10px 16px}.nav-links{display:none}
  .nav-hamburger{display:flex;flex-direction:column;gap:4px}
  .nav-hamburger span{width:22px;height:2px;background:var(--chuka-red);border-radius:2px;display:block}
  .nav-mobile{flex-direction:column;gap:4px;padding:12px 20px;border-bottom:1px solid var(--border);background:var(--bg)}
  .nav-mobile.open{display:flex}
  .nav-mobile a{font-size:14px;font-weight:500;color:var(--text-muted);text-decoration:none;padding:8px 0;border-bottom:1px solid var(--border)}
  .hero{padding:56px 20px 48px}.section{padding:40px 20px}.announcements-section{padding:0 20px 40px}
  .stats{flex-wrap:wrap}.stat{border-right:none;border-bottom:1px solid var(--border);flex:1 1 50%}
  .footer-grid{grid-template-columns:1fr 1fr;gap:28px}.cta-band{padding:48px 20px}.footer{padding:36px 20px 24px}
  .year-band{padding:24px 20px}.courses-top{padding:36px 20px 0}.courses-grid{padding:24px 20px}
  .year-hero{padding:24px 20px}.year-tab{padding:12px 18px;font-size:13px}
  .contact-page-wrap{padding:32px 16px}.contact-top{grid-template-columns:1fr;gap:28px}
  .club-hero{padding:48px 20px 36px}.club-logo-header{flex-direction:column;align-items:flex-start}
  .club-event{flex-direction:column;gap:10px}
  .club-event-date{width:100%;display:flex;gap:8px;align-items:center;justify-content:center;padding:8px 14px;border-radius:8px}
  .portfolio-preview-card{padding:32px 20px}
  .admin-layout{grid-template-columns:1fr}.admin-sidebar{display:none}
  .admin-topbar{padding:12px 20px}.admin-content{padding:24px 16px}
  .form-row{grid-template-columns:1fr}
}
</style>
